[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 接口测试与 UI 测试用 marker 区分，便于单独执行
markers =
    api: 接口自动化测试
    ui: UI 自动化测试（Playwright）
    smoke: 冒烟用例（核心链路，CI 每次必跑）
addopts = -v
    --strict-markers
    --alluredir=reports/allure-results
    --html=reports/report.html
    --self-contained-html

# 注意：这里刻意不加 --clean-alluredir。
# 该参数在会话启动最早期整目录删除 allure-results，一旦被安全策略拦下，
# pytest 会直接 INTERNALERROR 退出，且看不到具体原因。
# 因此改由 conftest.py 的 pytest_sessionstart 钩子在每轮测试前清空该目录，
# 全程容错：删不掉也不影响测试执行。
