[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 接口测试与 UI 测试用 marker 区分，便于单独执行
markers =
    api: 接口自动化测试
    ui: UI 自动化测试（Playwright）
    smoke: 冒烟用例（核心链路，CI 每次必跑）
addopts = -v
    --strict-markers
    --alluredir=reports/allure-results
    --html=reports/report.html
    --self-contained-html

# 注意：这里刻意不加 --clean-alluredir。
# 该参数会整目录删除 allure-results，在部分受限环境中会被批量删除保护拦截，
# 导致 pytest 启动即 INTERNALERROR。CI 中由 allure generate --clean 负责清理。
