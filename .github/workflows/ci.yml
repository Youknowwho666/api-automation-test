name: 自动化测试 CI

# 触发条件：
# 1. push / PR 到 main 分支 —— 保证主干代码始终可测
# 2. 每天 01:00 UTC（北京时间 09:00）定时回归 —— 及时发现被测站点或依赖变更导致的失败
# 3. 手动触发 —— 需要单独跑一次时用
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  # ============ 接口自动化：跑得快，作为第一道门禁 ============
  api-test:
    name: 接口自动化测试
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安装依赖（国内源加速）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --no-cache-dir

      - name: 4. 执行接口测试
        run: |
          python -m pytest testcases/posts testcases/users testcases/comments \
            -v --alluredir=reports/allure-results-api

      - name: 5. 上传 pytest-html 报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/report.html

      - name: 6. 上传 Allure 原始结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: reports/allure-results-api

  # ============ UI 自动化：依赖浏览器，单独一个 job ============
  ui-test:
    name: UI 自动化测试
    runs-on: ubuntu-latest
    needs: api-test

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安装依赖（国内源加速）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/ --no-cache-dir

      - name: 4. 安装 Playwright 浏览器
        run: python -m playwright install chromium --with-deps

      - name: 5. 执行 UI 测试
        run: |
          python -m pytest testcases/ui \
            -v --alluredir=reports/allure-results-ui
        env:
          # CI 中强制无头模式
          TEST_UI_HEADLESS: "true"

      - name: 6. 上传 Allure 原始结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui
          path: reports/allure-results-ui

  # ============ 汇总 Allure 报告：合并两端结果，产出可浏览的 HTML ============
  allure-report:
    name: 生成 Allure 报告
    runs-on: ubuntu-latest
    needs: [ api-test, ui-test ]
    if: always()

    steps:
      - name: 1. 下载接口测试结果
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results

      - name: 2. 下载 UI 测试结果
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results

      - name: 3. 安装 Allure 命令行
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -sSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: 4. 生成 Allure HTML 报告
        run: allure generate allure-results -o allure-report --clean

      - name: 5. 上传 Allure HTML 报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report
          path: allure-report
